name: Build Baseer

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Build with Gradle
      run: |
        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
        echo "rootProject.name = 'Baseer'" >> settings.gradle
        echo "include ':app'" >> settings.gradle
        mkdir -p app/src/main/java/com/baseer/app
        echo "plugins { id 'com.android.application' }" > app/build.gradle
        echo "android { namespace 'com.baseer.app'; compileSdk 34; defaultConfig { applicationId 'com.baseer.app'; minSdk 24; targetSdk 34 } }" >> app/build.gradle
        gradle wrapper
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: app/build/outputs/apk/debug/app-debug.apk
